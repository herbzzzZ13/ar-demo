<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AR模型展示</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
}

#wechatTip{
    display:none;
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:9999;
    background:#fff3cd;
    color:#856404;
    padding:12px;
    text-align:center;
    font-size:14px;
}

model-viewer{
    width:100%;
    height:100vh;
}
</style>
</head>

<body>

<div id="wechatTip">
请点击右上角菜单，然后选择“在浏览器打开”，以体验AR功能
</div>

<model-viewer
src="test(1).glb"
ar
ar-modes="webxr scene-viewer quick-look"
camera-controls
auto-rotate>
</model-viewer>

<script>
const ua = navigator.userAgent.toLowerCase();

if (ua.indexOf('micromessenger') > -1) {
    document.getElementById('wechatTip').style.display = 'block';
}
</script>

</body>
</html>
