<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR 模型展示</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100vh;
    }
    #notice {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.8);
      padding: 8px 12px;
      border-radius: 6px;
      display: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="notice">请在 Safari 或 Chrome 浏览器打开以体验 AR</div>

  <model-viewer id="model"
                src="https://herbzzzZ13.github.io/ar-demo/test1.glb"
                ios-src="https://herbzzzZ13.github.io/ar-demo/test1.usdz"
                alt="AR 模型"
                ar
                ar-modes="scene-viewer quick-look"
                environment-image="neutral"
                auto-rotate
                camera-controls>
  </model-viewer>

  <script>
    // 检测微信内置浏览器
    const ua = navigator.userAgent.toLowerCase();
    const notice = document.getElementById('notice');
    if(ua.indexOf('micromessenger') !== -1){
      // 微信浏览器
      notice.style.display = 'block';
    }
  </script>
</body>
</html>
